<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>OpenUsage</title>
<style>
  :root {
    --bg: rgba(22, 24, 29, 0.97);
    --panel: #1c1f25;
    --line: #2b3038;
    --ink: #e9edf3;
    --muted: #8f99a8;
    --accent: #d98a3d;
    --good: #46b8a8;
    --bad: #d9614c;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: transparent;
    color: var(--ink);
    font: 13.5px/1.55 ui-sans-serif, -apple-system, "Segoe UI", Inter, sans-serif;
    -webkit-font-smoothing: antialiased;
    user-select: none;
  }
  .card {
    margin: 6px; background: var(--bg);
    border: 1px solid var(--line); border-radius: 12px;
    overflow: hidden; box-shadow: 0 12px 40px rgba(0,0,0,.5);
  }
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 13px 16px; border-bottom: 1px solid var(--line);
    -webkit-app-region: drag;
  }
  .brand { font-weight: 650; letter-spacing: -.02em; }
  .brand span { color: var(--accent); }
  .close {
    -webkit-app-region: no-drag; width: 24px; height: 24px; border-radius: 6px;
    border: 1px solid var(--line); background: var(--panel); color: var(--muted);
    cursor: pointer; font-size: 14px; line-height: 1;
  }
  .close:hover { color: var(--ink); border-color: var(--accent); }

  .totals { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--line); }
  .tot { background: var(--panel); padding: 13px 14px; }
  .tot b { display: block; font-size: 19px; font-weight: 650; letter-spacing: -.02em; }
  .tot i { font-style: normal; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .07em; }

  section { padding: 14px 16px; border-top: 1px solid var(--line); }
  h2 { font-size: 10.5px; text-transform: uppercase; letter-spacing: .09em; color: var(--accent); margin-bottom: 10px; font-weight: 660; }

  .model { padding: 8px 0; border-bottom: 1px solid rgba(43,48,56,.6); }
  .model:last-child { border-bottom: 0; }
  .row { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .name { font-weight: 560; font-size: 12.5px; }
  .cost { font-variant-numeric: tabular-nums; font-weight: 600; }
  .meta { color: var(--muted); font-size: 11.5px; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .bar { height: 3px; background: var(--line); border-radius: 2px; margin-top: 6px; overflow: hidden; }
  .bar > i { display: block; height: 100%; background: var(--accent); }

  .roots { font-size: 11.5px; color: var(--muted); }
  .roots div { padding: 2px 0; }
  .empty { color: var(--muted); text-align: center; padding: 26px 16px; }
  footer { padding: 10px 16px; color: var(--muted); font-size: 11px; border-top: 1px solid var(--line); }
</style>
</head>
<body>
<div class="card">
  <header>
    <div class="brand">Open<span>Usage</span></div>
    <button class="close" onclick="window.__TAURI__?.window?.getCurrentWindow?.()?.hide?.()">×</button>
  </header>

  <div id="body"><div class="empty">Scanning Claude Code sessions…</div></div>

  <footer id="foot">—</footer>
</div>

<script>
const fmtTok = n => {
  if (n >= 1e9) return (n / 1e9).toFixed(2) + 'B';
  if (n >= 1e6) return (n / 1e6).toFixed(2) + 'M';
  if (n >= 1e3) return (n / 1e3).toFixed(1) + 'K';
  return String(n);
};
const accountsSection = list => {
  if (!list.length) return '<div class="roots"><div>No other tools detected.</div></div>';
  return list.map(a => {
    const bal = a.balanceUsd != null ? fmtUsd(a.balanceUsd)
             : a.limitUsd != null ? 'limit ' + fmtUsd(a.limitUsd) : '';
    const meta = [a.provider, a.detail].filter(Boolean).join(' · ');
    return `<div class="model">
      <div class="row"><span class="name">${a.label}</span><span class="cost">${bal}</span></div>
      <div class="meta">${meta}</div>
    </div>`;
  }).join('');
};

const fmtUsd = v => v >= 100 ? '$' + v.toFixed(0) : v >= 10 ? '$' + v.toFixed(2) : '$' + v.toFixed(3);

async function render() {
  const invoke = window.__TAURI__?.core?.invoke;
  if (!invoke) { document.getElementById('body').innerHTML = '<div class="empty">Tauri runtime not available.</div>'; return; }

  const r = await invoke('get_usage');
  let accounts = [];
  try { accounts = await invoke('get_accounts') || []; } catch (e) { accounts = []; }
  const body = document.getElementById('body');

  if (!r.models || !r.models.length) {
    body.innerHTML = `<div class="empty">No Claude Code usage found.<br><br>
      <span style="font-size:11.5px">Looked in ${(r.roots || []).length || 'no'} config root(s).<br>
      OpenUsage reads <code>~/.claude/projects/**/*.jsonl</code>.</span></div>`;
    document.getElementById('foot').textContent = 'No data';
    return;
  }

  const max = Math.max(...r.models.map(m => m.costUsd || m.tokens.total()));
  const models = r.models.map(m => {
    const c = m.costUsd ?? m.costUSD ?? m.cost_usd ?? 0;
    const t = m.tokens;
    const total = (t.input|0) + (t.output|0) + (t.cacheRead ?? t.cache_read ?? 0) + (t.cacheWrite ?? t.cache_write ?? 0);
    const w = max ? Math.max(2, (c / max) * 100) : 2;
    return `<div class="model">
      <div class="row"><span class="name">${m.model}</span><span class="cost">${fmtUsd(c)}</span></div>
      <div class="meta">${fmtTok(total)} tokens · ${m.requests} requests · in ${fmtTok(t.input)} / out ${fmtTok(t.output)} / cache ${fmtTok((t.cacheRead ?? t.cache_read) + (t.cacheWrite ?? t.cache_write))}</div>
      <div class="bar"><i style="width:${w}%"></i></div>
    </div>`;
  }).join('');

  body.innerHTML = `
    <div class="totals">
      <div class="tot"><b>${fmtTok(r.totalTokens ?? r.total_tokens)}</b><i>tokens</i></div>
      <div class="tot"><b>${fmtUsd(r.totalCostUsd ?? r.total_cost_usd ?? 0)}</b><i>est. spend</i></div>
      <div class="tot"><b>${r.totalRequests ?? r.total_requests ?? 0}</b><i>requests</i></div>
    </div>
    <section><h2>By model</h2>${models}</section>
    <section><h2>Accounts &amp; balances</h2>${accountsSection(accounts)}</section>
    <section><h2>Config roots scanned</h2><div class="roots">${(r.roots||[]).map(x => `<div>${x}</div>`).join('') || '<div>none found</div>'}</div></section>`;

  document.getElementById('foot').textContent =
    `${r.scannedFiles ?? r.scanned_files ?? 0} files · last 30 days`;
}

render();
setInterval(render, 60000);
</script>
</body>
</html>
