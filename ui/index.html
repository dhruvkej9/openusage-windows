<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>OpenUsage</title>
<style>
  :root {
    --bg: rgba(22, 24, 29, 0.97);
    --panel: #1c1f25;
    --line: #2b3038;
    --ink: #e9edf3;
    --muted: #8f99a8;
    --accent: #d98a3d;
    --good: #46b8a8;
    --bad: #d9614c;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: transparent; color: var(--ink);
    font: 13.5px/1.55 ui-sans-serif, -apple-system, "Segoe UI", Inter, sans-serif;
    -webkit-font-smoothing: antialiased; user-select: none;
  }
  .card {
    margin: 6px; background: var(--bg); border: 1px solid var(--line);
    border-radius: 12px; overflow: hidden; box-shadow: 0 12px 40px rgba(0,0,0,.5);
    display: flex; flex-direction: column; max-height: 96vh;
  }
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 15px; border-bottom: 1px solid var(--line); -webkit-app-region: drag;
    flex: 0 0 auto;
  }
  .brand { font-weight: 650; letter-spacing: -.02em; }
  .brand span { color: var(--accent); }
  .hbtns { display: flex; gap: 6px; -webkit-app-region: no-drag; }
  .ibtn {
    width: 26px; height: 26px; border-radius: 7px; border: 1px solid var(--line);
    background: var(--panel); color: var(--muted); cursor: pointer; font-size: 13px;
    display: grid; place-items: center;
  }
  .ibtn:hover { color: var(--ink); border-color: var(--accent); }
  .ibtn.on { color: var(--accent); border-color: var(--accent); }

  nav.tabs { display: flex; gap: 2px; padding: 8px 12px 0; border-bottom: 1px solid var(--line); flex: 0 0 auto; }
  nav.tabs button {
    background: none; border: 0; border-bottom: 2px solid transparent;
    color: var(--muted); padding: 7px 11px; font-size: 12.5px; cursor: pointer; font-family: inherit;
  }
  nav.tabs button.on { color: var(--ink); border-bottom-color: var(--accent); }

  #scroll { overflow-y: auto; flex: 1 1 auto; }
  #scroll::-webkit-scrollbar { width: 8px; }
  #scroll::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }

  .totals { display: grid; grid-template-columns: repeat(3,1fr); gap: 1px; background: var(--line); }
  .tot { background: var(--panel); padding: 13px 14px; }
  .tot b { display: block; font-size: 19px; font-weight: 650; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .tot i { font-style: normal; font-size: 10.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .07em; }

  section { padding: 13px 15px; border-top: 1px solid var(--line); }
  section:first-child { border-top: 0; }
  h2 { font-size: 10.5px; text-transform: uppercase; letter-spacing: .09em; color: var(--accent); margin-bottom: 9px; font-weight: 660; }

  .model { padding: 7px 0; border-bottom: 1px solid rgba(43,48,56,.55); }
  .model:last-child { border-bottom: 0; }
  .row { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .name { font-weight: 560; font-size: 12.5px; }
  .cost { font-variant-numeric: tabular-nums; font-weight: 600; }

  .spark { display: flex; align-items: flex-end; gap: 1.5px; height: 28px; margin-top: 8px; }
  .spark > i {
    flex: 1 1 0; min-width: 1px; background: var(--accent); border-radius: 1px;
    min-height: 1.5px; opacity: .8;
  }
  .spark > i.hi { background: var(--good); opacity: 1; }
  .spark-labels { display: flex; justify-content: space-between; color: var(--muted); font-size: 10px; margin-top: 3px; }

  .meta { color: var(--muted); font-size: 11.5px; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .bar { height: 3px; background: var(--line); border-radius: 2px; margin-top: 6px; overflow: hidden; }
  .bar > i { display: block; height: 100%; background: var(--accent); }

  .rl { padding: 8px 0; border-bottom: 1px solid rgba(43,48,56,.55); }
  .rl:last-child { border-bottom: 0; }
  .pill { font-size: 10.5px; padding: 1.5px 7px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
  .pill.ok { color: var(--good); border-color: rgba(70,184,168,.4); }
  .pill.warn { color: var(--accent); border-color: rgba(217,138,61,.4); }
  .pill.hot { color: var(--bad); border-color: rgba(217,97,76,.45); }

  .roots { font-size: 11.5px; color: var(--muted); }
  .roots div { padding: 2px 0; word-break: break-all; }
  .roots .model { color: var(--ink); }

  .empty { color: var(--muted); text-align: center; padding: 30px 16px; }
  .empty code { font-size: 11px; }

  .tbtn {
    background: var(--panel); border: 1px solid var(--line); color: var(--ink);
    border-radius: 8px; padding: 8px 13px; font-size: 12.5px; cursor: pointer; font-family: inherit;
  }
  .tbtn:hover { border-color: var(--accent); }
  .tbtn.primary { background: var(--accent); color: #14100a; border-color: var(--accent); font-weight: 600; }
  .tbtn:disabled { opacity: .5; cursor: default; }
  .row-btns { display: flex; gap: 8px; margin-top: 10px; }

  .wlist { display: flex; flex-direction: column; gap: 1px; }
  .wrow {
    display: flex; align-items: center; gap: 9px; padding: 9px 4px;
    border-bottom: 1px solid rgba(43,48,56,.5);
  }
  .wrow:last-child { border-bottom: 0; }
  .wrow .nm { flex: 1 1 auto; font-size: 12.5px; }
  .ord { display: flex; flex-direction: column; gap: 1px; }
  .ord button {
    width: 22px; height: 15px; border: 1px solid var(--line); background: var(--panel);
    color: var(--muted); border-radius: 4px; cursor: pointer; font-size: 9px; line-height: 1;
  }
  .ord button:hover { color: var(--accent); border-color: var(--accent); }

  .keyrow { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid rgba(43,48,56,.5); }
  .keyrow:last-child { border-bottom: 0; }
  .keyrow .p { flex: 0 0 92px; font-size: 12px; }
  .keyrow input {
    flex: 1 1 auto; background: var(--panel); border: 1px solid var(--line); color: var(--ink);
    border-radius: 7px; padding: 6px 9px; font-size: 12px; font-family: ui-monospace, Menlo, monospace;
  }
  .keyrow input:focus { outline: none; border-color: var(--accent); }
  .keyrow .x { background: none; border: 0; color: var(--muted); cursor: pointer; font-size: 15px; padding: 0 4px; }
  .keyrow .x:hover { color: var(--bad); }

  #cardPreview { margin-top: 12px; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: #0b0d10; }
  #cardPreview img { display: block; width: 100%; height: auto; }

  .set { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 0; border-bottom: 1px solid rgba(43,48,56,.55); }
  .set:last-child { border-bottom: 0; }
  .set .lbl b { display: block; font-size: 12.5px; font-weight: 560; }
  .set .lbl i { font-style: normal; font-size: 11px; color: var(--muted); }
  .val { font-size: 12px; color: var(--accent); font-variant-numeric: tabular-nums; white-space: nowrap; }

  footer { padding: 9px 15px; color: var(--muted); font-size: 11px; border-top: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; flex: 0 0 auto; }
  button.link { background: none; border: 0; color: var(--muted); font-size: 11px; cursor: pointer; font-family: inherit; text-decoration: underline; }
  button.link:hover { color: var(--accent); }
</style>
</head>
<body>
<div class="card">
  <header>
    <div class="brand">Open<span>Usage</span></div>
    <div class="hbtns">
      <button class="ibtn" id="btnSettings" title="Settings">&#9881;</button>
      <button class="ibtn" id="btnRefresh" title="Refresh">&#10227;</button>
      <button class="ibtn" id="btnClose" title="Close">&times;</button>
    </div>
  </header>

  <nav class="tabs" id="tabs">
    <button data-tab="dash" class="on">Dashboard</button>
    <button data-tab="trend">Trend</button>
    <button data-tab="settings">Settings</button>
    <button data-tab="customize">Customize</button>
    <button data-tab="keys">API Keys</button>
    <button data-tab="share">Share</button>
  </nav>

  <div id="scroll"><div class="empty">Scanning Claude Code sessions&hellip;</div></div>

  <footer>
    <span id="foot">&mdash;</span>
    <button class="link" id="btnAbout">about</button>
  </footer>
</div>

<script>
const $ = id => document.getElementById(id);
const hide = () => window.__TAURI__?.window?.getCurrentWindow?.()?.hide?.();

$('btnClose').onclick = hide;
$('btnRefresh').onclick = () => render();
$('btnSettings').onclick = () => setTab('settings');
$('tabs').onclick = e => { const b = e.target.closest('button'); if (b) setTab(b.dataset.tab); };
$('btnAbout').onclick = () => alert(
  'OpenUsage 0.1.0\nWindows tray tracker for Claude Code\n\ngithub.com/dhruvkej9/openusage-windows');

let TAB = 'dash';
function setTab(t) {
  TAB = t;
  [...$('tabs').children].forEach(b => b.classList.toggle('on', b.dataset.tab === t));
  $('btnSettings').classList.toggle('on', t === 'settings');
  render();
}

const fmtTok = n => n >= 1e9 ? (n/1e9).toFixed(2)+'B' : n >= 1e6 ? (n/1e6).toFixed(2)+'M'
                   : n >= 1e3 ? (n/1e3).toFixed(1)+'K' : String(n);
const fmtUsd = v => v >= 100 ? '$'+v.toFixed(0) : v >= 10 ? '$'+v.toFixed(2) : '$'+v.toFixed(3);

function sparkline(points, key) {
  if (!points || points.length < 2) return '';
  const vals = points.map(p => p[key] ?? 0);
  const max = Math.max(...vals);
  const peak = vals.lastIndexOf(max);
  return '<div class="spark">' + vals.map((v, i) =>
    '<i class="' + (i === peak ? 'hi' : '') + '" style="height:' + Math.max(6, (v/(max||1))*100) + '%"></i>').join('')
    + '</div><div class="spark-labels"><span>' + points[0].day.slice(5)
    + '</span><span>' + points[points.length-1].day.slice(5) + '</span></div>';
}

function rlPill(u) {
  if (u == null) return '<span class="pill">n/a</span>';
  const pct = Math.round(u * 100);
  const cls = pct >= 90 ? 'hot' : pct >= 65 ? 'warn' : 'ok';
  return '<span class="pill ' + cls + '">' + pct + '%</span>';
}

function resetsText(mins) {
  if (mins == null) return 'reset time unknown';
  if (mins <= 0) return 'resets now';
  if (mins < 60) return 'resets in ' + mins + 'm';
  if (mins < 2880) return 'resets in ' + Math.round(mins/60) + 'h';
  return 'resets in ' + Math.round(mins/1440) + 'd';
}

function accountsSection(list) {
  if (!list || !list.length) return '<div>No other tools detected.</div>';
  return list.map(a => {
    const bal = a.balanceUsd != null ? fmtUsd(a.balanceUsd)
             : a.limitUsd != null ? 'limit ' + fmtUsd(a.limitUsd) : '';
    const meta = [a.provider, a.detail].filter(Boolean).join(' · ');
    return '<div class="model"><div class="row"><span class="name">' + a.label
      + '</span><span class="cost">' + bal + '</span></div>'
      + '<div class="meta">' + meta + '</div></div>';
  }).join('');
}


let SETTINGS = null, WIDGETS = [], HIDDEN = new Set(), MASKED = [];
const shown = id => !HIDDEN.has(id);

async function loadSettings() {
  const invoke = window.__TAURI__?.core?.invoke;
  SETTINGS = await invoke('get_settings').catch(() => null);
  WIDGETS = await invoke('get_widgets').catch(() => []);
  MASKED = await invoke('get_masked_keys').catch(() => []);
  HIDDEN = new Set(SETTINGS?.hiddenWidgets || []);
}

async function patch(obj) {
  const invoke = window.__TAURI__?.core?.invoke;
  await invoke('update_settings', { patch: obj }).catch(e => alert(String(e)));
  await loadSettings();
  render();
}

function moveWidget(id, dir) {
  const order = WIDGETS.map(w => w.id);
  const i = order.indexOf(id);
  const j = i + dir;
  if (i < 0 || j < 0 || j >= order.length) return;
  [order[i], order[j]] = [order[j], order[i]];
  patch({ providerOrder: order });
}

function moveProvider(p, dir) {
  const order = [...(SETTINGS?.providerOrder || [])];
  const i = order.indexOf(p);
  const j = i + dir;
  if (i < 0 || j < 0 || j >= order.length) return;
  [order[i], order[j]] = [order[j], order[i]];
  patch({ providerOrder: order });
}

function toggleWidget(id) {
  const h = new Set(HIDDEN);
  h.has(id) ? h.delete(id) : h.add(id);
  HIDDEN = h;
  patch({ hiddenWidgets: [...h] });
}

function widgetRow(w, i) {
  return '<div class="wrow"><div class="ord">'
    + '<button onclick="moveWidget(\'' + w.id + '\',-1)">&#9650;</button>'
    + '<button onclick="moveWidget(\'' + w.id + '\',1)">&#9660;</button></div>'
    + '<span class="nm">' + w.label + '</span>'
    + '<input type="checkbox" ' + (shown(w.id) ? 'checked' : '')
    + ' onclick="toggleWidget(\'' + w.id + '\')"></div>';
}

function providerRow(p, i, n) {
  const known = ['claude','opencode','cursor','codex','copilot','openrouter','zai','grok','devin','pi','ollama'];
  return '<div class="wrow"><div class="ord">'
    + '<button ' + (i === 0 ? 'disabled' : '') + ' onclick="moveProvider(\'' + p + '\',-1)">&#9650;</button>'
    + '<button ' + (i === n - 1 ? 'disabled' : '') + ' onclick="moveProvider(\'' + p + '\',1)">&#9660;</button></div>'
    + '<span class="nm">' + p + '</span></div>';
}

const KEY_TOOLS = ['openrouter','zai','opencode','copilot','cursor','grok','devin'];

function keyRow(tool, maskedVal) {
  return '<div class="keyrow"><span class="p">' + tool + '</span>'
    + '<input id="key_' + tool + '" type="password" placeholder="' + (maskedVal || 'not set') + '" value="">'
    + '<button class="tbtn" onclick="saveKey(\'' + tool + '\')">Save</button>'
    + '<button class="x" onclick="clearKey(\'' + tool + '\')">&times;</button></div>';
}

async function saveKey(tool) {
  const v = document.getElementById('key_' + tool).value.trim();
  await patch({ apiKeys: { [tool]: v } });
}

async function clearKey(tool) {
  await patch({ apiKeys: { [tool]: null } });
}

async function downloadCard() {
  const invoke = window.__TAURI__?.core?.invoke;
  const svgText = await invoke('get_share_card');
  const blob = new Blob([svgText], { type: 'image/svg+xml;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const img = new Image();
  img.onload = () => {
    const c = document.createElement('canvas');
    c.width = 1200; c.height = 630;
    const ctx = c.getContext('2d');
    // The card is drawn with a gradient; fill the background so the PNG is not transparent.
    ctx.fillStyle = '#0b0d10';
    ctx.fillRect(0, 0, 1200, 630);
    ctx.drawImage(img, 0, 0, 1200, 630);
    URL.revokeObjectURL(url);
    c.toBlob(b => {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(b);
      a.download = 'openusage-' + new Date().toISOString().slice(0, 10) + '.png';
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    }, 'image/png');
  };
  img.src = url;
}

async function render() {
  const invoke = window.__TAURI__?.core?.invoke;
  if (!invoke) { $('scroll').innerHTML = '<div class="empty">Tauri runtime not available.</div>'; return; }

  await loadSettings();
  const [r, series, accounts] = await Promise.all([
    invoke('get_usage'),
    invoke('get_series').catch(() => null),
    invoke('get_accounts').catch(() => []),
  ]);
  const models = r.models || [];


  if (TAB === 'customize') {
    const n = (SETTINGS?.providerOrder || []).length;
    $('scroll').innerHTML =
      '<section><h2>Dashboard widgets</h2><div class="wlist">'
      + WIDGETS.map((w, i) => widgetRow(w, i)).join('') + '</div></section>'
      + '<section><h2>Provider order</h2><div class="wlist">'
      + (SETTINGS?.providerOrder || []).map((p, i) => providerRow(p, i, n)).join('')
      + '</div></section>'
      + '<section><h2>History window</h2>'
      + '<div class="set"><div class="lbl"><b>Days of history</b><i>affects totals and the trend</i></div>'
      + '<span class="val">' + (SETTINGS?.historyDays ?? 30) + 'd</span></div>'
      + '<div class="row-btns">'
      + '<button class="tbtn" onclick="patch({historyDays: 7})">7d</button>'
      + '<button class="tbtn" onclick="patch({historyDays: 30})">30d</button>'
      + '<button class="tbtn" onclick="patch({historyDays: 90})">90d</button>'
      + '<button class="tbtn" onclick="patch({historyDays: 365})">1y</button>'
      + '</div></section>'
      + '<section><h2>Refresh</h2>'
      + '<div class="set"><div class="lbl"><b>Poll interval</b><i>tray tooltip + popover</i></div>'
      + '<span class="val">' + (SETTINGS?.pollSeconds ?? 60) + 's</span></div>'
      + '<div class="row-btns"><button class="tbtn" onclick="patch({pollSeconds: 30})">30s</button>'
      + '<button class="tbtn" onclick="patch({pollSeconds: 60})">60s</button>'
      + '<button class="tbtn" onclick="patch({pollSeconds: 300})">5m</button></div></section>';
    $('foot').textContent = 'customize';
    return;
  }

  if (TAB === 'keys') {
    const known = new Set(MASKED.map(m => m.provider));
    $('scroll').innerHTML =
      '<section><h2>Tool API keys</h2>'
      + KEY_TOOLS.map(t => keyRow(t, known.has(t) ? MASKED.find(m => m.provider === t).masked : null)).join('')
      + '</section>'
      + '<section><h2>How these are stored</h2>'
      + '<div class="meta" style="line-height:1.7">Keys are written to '
      + '<code>%APPDATA%\\OpenUsage\\settings.json</code> with owner-only permissions on Windows. '
      + 'They are read only to call that tool\u2019s own API \u2014 OpenUsage never transmits them anywhere. '
      + 'Existing keys are shown masked; saving an empty value clears one.</div></section>';
    $('foot').textContent = MASKED.length + ' key(s) stored';
    return;
  }

  if (TAB === 'share') {
    $('scroll').innerHTML =
      '<section><h2>Share card</h2>'
      + '<div class="meta">A 1200x630 PNG of your headline numbers, generated locally from the same '
      + 'scan the tray uses. Nothing is uploaded.</div>'
      + '<div class="row-btns"><button class="tbtn primary" id="btnDl" onclick="downloadCard()">Download PNG</button>'
      + '<button class="tbtn" onclick="copyCard()">Copy SVG</button></div>'
      + '<div id="cardPreview"></div></section>';
    $('foot').textContent = 'share';
    return;
  }

  if (TAB === 'settings') {
    const limits = series?.rateLimits || [];
    $('scroll').innerHTML =
      '<section><h2>Rate limits</h2>' + (limits.length ? limits.map(l =>
        '<div class="rl"><div class="row"><span class="name">' + l.name
        + (l.window ? ' <span class="pill">' + l.window + '</span>' : '')
        + '</span>' + rlPill(l.utilization) + '</div>'
        + '<div class="meta">' + resetsText(l.resetsInMinutes) + '</div>'
        + '<div class="bar"><i style="width:' + Math.min(100, (l.utilization ?? 0) * 100) + '%"></i></div></div>'
      ).join('') : '<div class="meta">No rate-limit data in the last 30 days.</div>') + '</section>'
      + '<section><h2>Data sources</h2>'
      + '<div class="set"><div class="lbl"><b>Config roots</b><i>' + (r.roots||[]).length + ' found</i></div>'
      + '<span class="val">' + (r.scannedFiles ?? r.scanned_files ?? 0) + ' files</span></div>'
      + '<div class="roots">' + (r.roots||[]).map(x => '<div>' + x + '</div>').join('') + '</div></section>'
      + '<section><h2>Accounts</h2><div class="roots">' + accountsSection(accounts) + '</div></section>'
      + '<section><h2>About</h2>'
      + '<div class="set"><div class="lbl"><b>OpenUsage</b><i>Windows tray tracker</i></div><span class="val">0.1.0</span></div>'
      + '<div class="set"><div class="lbl"><b>Pricing</b><i>compiled in, works offline</i></div><span class="val">opus 15/75</span></div>'
      + '<div class="set"><div class="lbl"><b>Poll interval</b><i>tray + popover</i></div><span class="val">60s</span></div>'
      + '</section>';
    $('foot').textContent = 'settings';
    return;
  }

  if (TAB === 'trend') {
    const days = series?.days || [];
    const perModel = series?.byModelPerDay || {};
    $('scroll').innerHTML =
      '<section><h2>Daily spend &middot; last 30 days</h2>'
      + (days.length > 1 ? sparkline(days, 'costUsd') : '<div class="meta">Not enough history for a trend yet.</div>')
      + '<div class="meta" style="margin-top:8px">' + days.length + ' active day(s) &middot; total '
      + fmtUsd(days.reduce((a, d) => a + (d.costUsd || 0), 0)) + '</div></section>'
      + models.filter(m => (perModel[m.model] || []).length > 1)
          .map(m => '<section><h2>' + m.model + '</h2>' + sparkline(perModel[m.model], 'costUsd') + '</section>').join('')
      + '<section><h2>By day</h2>' + (days.slice().reverse().slice(0, 14).map(d =>
          '<div class="model"><div class="row"><span class="name">' + d.day
          + '</span><span class="cost">' + fmtUsd(d.costUsd) + '</span></div>'
          + '<div class="meta">' + fmtTok(d.tokens) + ' tokens &middot; ' + d.requests + ' requests</div></div>'
        ).join('') || '<div class="meta">No daily data.</div>') + '</section>';
    $('foot').textContent = days.length + ' active days';
    return;
  }

  if (!models.length) {
    $('scroll').innerHTML = '<div class="empty">No Claude Code usage found.<br><br>'
      + '<span style="font-size:11.5px">Looked in ' + ((r.roots||[]).length || 'no')
      + ' config root(s).<br>Reads <code>~/.claude/projects/**/*.jsonl</code> and '
      + '<code>\\\\wsl$\\\\distro\\\\home\\\\user\\\\.claude</code>.</span></div>';
    $('foot').textContent = 'No data';
    return;
  }

  const max = Math.max(...models.map(m => m.costUsd ?? 0));
  const limits = series?.rateLimits || [];
  $('scroll').innerHTML =
    (shown('totals') ? '<div class="totals">'
      + '<div class="tot"><b>' + fmtTok(r.totalTokens ?? r.total_tokens) + '</b><i>tokens</i></div>'
      + '<div class="tot"><b>' + fmtUsd(r.totalCostUsd ?? r.total_cost_usd ?? 0) + '</b><i>est. spend</i></div>'
      + '<div class="tot"><b>' + (r.totalRequests ?? r.total_requests ?? 0) + '</b><i>requests</i></div>'
      + '</div>' : '')
    + (shown('sparkline') ? '<section><h2>Trend &middot; 30 days</h2>'
      + ((series?.days || []).length > 1 ? sparkline(series.days, 'costUsd')
         : '<div class="meta">Not enough history yet.</div>') + '</section>' : '')
    + (shown('models') ? '<section><h2>By model &middot; 30d</h2>' + models.map(m => {
        const t = m.tokens, total = (t.input|0) + (t.output|0) + (t.cacheRead ?? 0) + (t.cacheWrite ?? 0);
        return '<div class="model"><div class="row"><span class="name">' + m.model
          + '</span><span class="cost">' + fmtUsd(m.costUsd) + '</span></div>'
          + '<div class="meta">' + fmtTok(total) + ' tokens &middot; ' + m.requests + ' req &middot; in '
          + fmtTok(t.input) + ' / out ' + fmtTok(t.output) + ' / cache '
          + fmtTok((t.cacheRead ?? 0) + (t.cacheWrite ?? 0)) + '</div>'
          + '<div class="bar"><i style="width:' + Math.max(2, (m.costUsd/(max||1))*100) + '%"></i></div></div>';
      }).join('') + '</section>' : '')
    + (shown('ratelimits') && limits.length ? '<section><h2>Rate limits</h2>' + limits.map(l =>
        '<div class="rl"><div class="row"><span class="name">' + l.name + '</span>' + rlPill(l.utilization)
        + '</div><div class="meta">' + resetsText(l.resetsInMinutes) + '</div></div>').join('') + '</section>' : '')
    + (shown('accounts') ? '<section><h2>Accounts</h2><div class="roots">' + accountsSection(accounts) + '</div></section>' : '')
    + (shown('roots') ? '<section><h2>Config roots scanned</h2><div class="roots">'
      + (r.roots||[]).map(x => '<div>' + x + '</div>').join('') + '</div></section>' : '');

  $('foot').textContent = (r.scannedFiles ?? r.scanned_files ?? 0) + ' files · last 30 days';
}

async function copyCard() {
  const svgText = await window.__TAURI__.core.invoke('get_share_card');
  try { await navigator.clipboard.writeText(svgText); alert('SVG copied to clipboard.'); }
  catch (e) { alert('Clipboard blocked: ' + e); }
}

render();
setInterval(render, 60000);
</script>
